name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verif:
    name: Lint, build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (astro check + relecture des textes)
        run: npm run lint
      - name: Build
        run: npm run build:site
      - name: Tests du site construit (liens, HTML, secrets)
        run: npm run test:dist
      - name: Recherche de secrets dans le dépôt
        run: node scripts/check-secrets.mjs --repo
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: verif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (seuils dans lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.x autorun

  deploy:
    name: Mise en ligne (Cloudflare Workers)
    needs: [verif, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: wrangler deploy (sauté tant que le secret CLOUDFLARE_API_TOKEN n'est pas posé)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --message "git ${{ github.sha }}"

  docker:
    name: Image Docker
    needs: verif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (et publication sur GHCR depuis main)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: |
            ghcr.io/zapzcsgo/portfolio:latest
            ghcr.io/zapzcsgo/portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de l'image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker run -d --name site -p 8080:8080 ghcr.io/zapzcsgo/portfolio:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Matteo Murru"
          curl -fsS http://127.0.0.1:8080/projets/agents-ia/ | grep -q "Agents IA"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/projets/incident-base-de-donnees/)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nexiste-pas/)" = 404
