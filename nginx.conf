server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/projets/incident-base-de-donnees/?$ {
    return 301 /projets/agents-ia/;
  }

  location ~ ^/en/projects/database-incident/?$ {
    return 301 /en/projects/ai-agents/;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
